services:
  rag_postgres:
    image: pgvector/pgvector:pg16
    container_name: alpa_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_db
    ports:
      - "5434:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      retries: 5

  rag-llm-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpa_rag_llm_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - env/api.env.example
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@rag_postgres:5432/rag_db
      - KNOWLEDGE_DATABASE_URL=postgresql+psycopg://postgres:postgres@rag_postgres:5432/rag_db
      - RETRIEVER=real
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CLAUDE_MODEL=claude-3-5-sonnet-20241022
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      rag_postgres:
        condition: service_healthy

volumes:
  rag_pgdata:
